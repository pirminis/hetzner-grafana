services:
  graphite:
    image: graphiteapp/graphite-statsd:latest
    container_name: graphite
    restart: unless-stopped
    expose:
      - "80"
      - "2003/tcp"
      - "2003/udp"
      - "2004/tcp"
      - "2004/udp"
    volumes:
      - "./graphite_data/graphite_conf:/opt/graphite/conf"
      - "./graphite_data/graphite_storage:/opt/graphite/storage"
      - "./graphite_data/statsd_conf:/opt/statsd/config"

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - "./grafana_data:/var/lib/grafana"
    environment:
      - "GF_SECURITY_ADMIN_USER=grafana"
      - "GF_SECURITY_ADMIN_PASSWORD=grafanapw"
      - "GRAPHITE_BASIC_AUTH_PASSWORD=graphitepw"

  graphite-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - graphite
    restart: unless-stopped
    ports:
      - "2002:80"   # public HTTP entrypoint to Graphite via Nginx (with Basic Auth)
    volumes:
      - ./nginx/graphite.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
